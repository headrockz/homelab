---
- name: Deploy compose Service
  hosts: "{{ hosts | default([]) }}"
  become: true
  vars:
    compose_path: "{{ remote_path | default('~/compose') }}"
    local_dir: "{{ playbook_dir }}/../../docker-compose/{{ compose_name }}"
  collections:
    - community.docker

  tasks:
    - name: Synchronize docker-compose files
      ansible.posix.synchronize:
        src: "{{ local_dir }}/"
        dest: "{{ compose_path }}/{{ compose_name }}"
        recursive: true
        delete: true
        rsync_opts:
          - "--exclude=acme.json"
          - "--exclude=otel.alloy"
          - "--exclude=postgresql.alloy"
          - "--exclude=syslog.alloy"
          - "--exclude=.htpasswd"
          - "--exclude=certs/"

    - name: Update server .env file with hostname
      ansible.builtin.lineinfile:
        path: "{{ compose_path }}/{{ compose_name }}/.env"
        regexp: '^SERVER='
        line: "SERVER={{ ansible_hostname }}"

    - name: Update hostname .env file with hostname
      ansible.builtin.lineinfile:
        path: "{{ compose_path }}/{{ compose_name }}/.env"
        regexp: '^HOSTNAME='
        line: "HOSTNAME={{ ansible_hostname }}"

    - name: Update docker volume path
      ansible.builtin.lineinfile:
        path: "{{ compose_path }}/{{ compose_name }}/.env"
        regexp: '^DOCKER_DATA='
        line: "DOCKER_DATA={{ docker_volume | default('~/docker') }}"

    # Specific case for stack garage, zerobyte, and syncthing
    - name: Update volume data (only for containers garage, zerobyte, syncthing)
      when: compose_name in ["garage-hq", "zerobyte", "syncthing"]
      ansible.builtin.lineinfile:
        path: "{{ compose_path }}/{{ compose_name }}/.env"
        regexp: '^VOLUME_DATA='
        line: "VOLUME_DATA={{ volume_data | default('~/compose') }}"

    # Specific case for stack "traefik"
    - name: Update middleware.yaml with hostname
      when: compose_name == "traefik"
      ansible.builtin.shell:
        cmd: |
          sed -i "s|address: http://authentik-server:9000/outpost.goauthentik.io/auth/traefik|address: http://ak-outpost-$(hostname)-outpost:9000/outpost.goauthentik.io/auth/traefik|g" {{ compose_path }}/{{ compose_name }}/config/middleware.yaml
      register: sed_result
      changed_when: sed_result.rc == 0
      failed_when: sed_result.rc != 0

    - name: Update middleware.yaml with hostname
      when: compose_name == "traefik"
      ansible.builtin.shell:
        cmd: |
          sed -i "s|\"falcon\"|\"{{ ansible_hostname }}\"|g" {{ compose_path }}/{{ compose_name }}/config/traefik.yaml
      register: sed_result
      changed_when: sed_result.rc == 0
      failed_when: sed_result.rc != 0

    - name: Create docker network server-backend if it doesn't exist
      community.docker.docker_network:
        name: server-backend
        state: present
      changed_when: false

    - name: Create docker network server-database if it doesn't exist
      community.docker.docker_network:
        name: server-database
        state: present
      changed_when: false

    - name: Deploy compose stack using docker-compose
      community.docker.docker_compose_v2:
        project_src: "{{ compose_path }}/{{ compose_name }}"
        files:
          - docker-compose.yaml
        state: present
        pull: policy
        remove_orphans: true
