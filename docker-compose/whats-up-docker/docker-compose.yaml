---
services:
  wud:
    image: getwud/wud:9.2.0
    container_name: wud
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_DATA}/certs:/certs
      - /etc/localtime:/etc/localtime:ro
      - ${CERTS_PATH}/certs/services:/certs
      - ${DOCKER_PATH}:/stacks
      - wud_data:/store
    env_file:
      - .env
    environment:
      - WUD_TRIGGER_DOCKERCOMPOSE_FALCON_FILE=/stacks/$${container.labels['com.docker.compose.project']}/docker-compose.yaml
    # ports:
    #   - 3000:3000
    networks:
      - server-backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.wud.entrypoints=https
      - traefik.http.routers.wud.rule=Host(`wud.${SERVER}.${DOMAIN}`)
      - traefik.http.routers.wud.tls=true
      - traefik.http.routers.wud.tls.certresolver=cloudflare
      - traefik.http.services.wud.loadbalancer.server.port=3000
      - traefik.http.routers.wud.service=wud

networks:
  server-backend:
    external: true

volumes:
  wud_data:
