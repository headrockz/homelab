---
services:
  bookorbit:
    image: ghcr.io/bookorbit/bookorbit:3.2.0
    container_name: bookorbit
    restart: unless-stopped
    init: true
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      - ${MEDIA}:/books
      - ${DOCKER_DATA}/bookorbit/data:/data
    # ports:
    #   - "3000:3000"
    networks:
      - server-backend
      - server-database
    labels:
      - traefik.enable=true
      - traefik.http.routers.bookorbit.entrypoints=https
      - traefik.http.routers.bookorbit.rule=Host(`bookorbit.${DOMAIN}`)
      - traefik.http.routers.bookorbit.tls=true
      - traefik.http.routers.bookorbit.tls.certresolver=cloudflare
      - traefik.http.services.bookorbit.loadbalancer.server.port=3000
      - traefik.http.routers.bookorbit.service=bookorbit
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    security_opt:
      - no-new-privileges:true

