---
services:
  transmission:
    image: lscr.io/linuxserver/transmission:4.1.2
    container_name: transmission
    restart: always
    environment:
      - PUID=${UID}
      - PGID=${UIG}
      - TZ=${TZ}
      - USER=${TRANSMISSION_USER}
      - PASS=${TRANSMISSION_PASSWORD}
    volumes:
      - transmission_config:/config
      - ${MEDIA}/downloads:/downloads
      - ${MEDIA}/watch:/watch
    ports:
      # - 9091:9091
      - 51413:51413
      - 51413:51413/udp
    networks:
      - server-backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.transmission.entrypoints=https
      - traefik.http.routers.transmission.rule=Host(`transmission.${DOMAIN}`)
      - traefik.http.routers.transmission.tls=true
      - traefik.http.services.transmission.loadbalancer.server.port=9091
      - traefik.http.routers.transmission.tls.certresolver=cloudflare
      - traefik.http.routers.transmission.service=transmission
      - traefik.http.routers.transmission.middlewares=authentik@file

  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    restart: always
    environment:
      - PUID=${UID}
      - PGID=${UIG}
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/jellyfin/config:/config
      - ${MEDIA}:/Media
    ports:
      # - 8096:8096/tcp
      # - 8920:8920/tcp
      - 7359:7359/udp
      - 1900:1900/udp
    networks:
      - server-backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyfin.entrypoints=https
      - traefik.http.routers.jellyfin.rule=Host(`jellyfin.${DOMAIN}`)
      - traefik.http.routers.jellyfin.tls=true
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096
      - traefik.http.routers.jellyfin.tls.certresolver=cloudflare
      - traefik.http.routers.jellyfin.service=jellyfin
    devices:
      - /dev/dri:/dev/dri

networks:
  server-backend:
    external: true

volumes:
  transmission_config:
